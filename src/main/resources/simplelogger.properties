# SLF4J Simple logging configuration.
#
# The game's own event logging (uno.* loggers) stays at INFO so game start,
# turns, cards played/drawn, invalid input and round/game end are recorded.
# Everything else (Hibernate bootstrap chatter, etc.) is raised to WARN so it
# does not drown out the player-facing console.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.uno=info
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.levelInBrackets=true
